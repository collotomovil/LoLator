<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Coach</title>
<style>
  body{font-family:system-ui;background:#0f1419;color:#e6e6e6;max-width:520px;margin:auto;padding:12px}
  input,select,button,textarea{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:8px;border:1px solid #333;background:#1b232c;color:#fff;font-size:16px}
  button{background:#c89b3c;color:#000;font-weight:bold;border:0}
  .fila{display:flex;gap:6px}
  #salida{white-space:pre-wrap;background:#1b232c;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<h2>Draft Coach</h2>
<div class="fila">
  <input id="nombre" placeholder="Nombre">
  <input id="tag" placeholder="TAG" style="max-width:100px">
</div>
<div class="fila">
  <select id="rol"><option>top</option><option>jungla</option><option>mid</option><option>adc</option><option>support</option></select>
  <input id="parche" placeholder="Parche (ej. 26.21)">
</div>
<textarea id="aliados" rows="2" placeholder="Aliados (campeones)"></textarea>
<textarea id="enemigos" rows="2" placeholder="Enemigos (campeones)"></textarea>
<textarea id="bans" rows="2" placeholder="Baneos"></textarea>
<div class="fila">
  <button onclick="ir('ban')">Qué banear</button>
  <button onclick="ir('pick')">Qué pickear</button>
  <button onclick="ir('build')">Build</button>
</div>
<div id="salida"></div>

<script>
const API = "https://TU-WORKER.TU-USUARIO.workers.dev";
const ids = ["nombre","tag","rol","parche","aliados","enemigos","bans"];

ids.forEach(i => { const v = localStorage.getItem(i); if (v) document.getElementById(i).value = v; });

async function ir(modo) {
  const datos = { modo };
  ids.forEach(i => {
    datos[i] = document.getElementById(i).value;
    localStorage.setItem(i, datos[i]);
  });
  const out = document.getElementById("salida");
  out.textContent = "Pensando...";
  try {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(datos) });
    const j = await r.json();
    out.textContent = j.error ? "Error: " + j.error : j.respuesta;
  } catch (e) { out.textContent = "Error: " + e.message; }
}
</script>
</body>
</html>

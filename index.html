<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLator</title>
<style>
  :root{--bg:#0f1419;--card:#1b232c;--gold:#c89b3c;--azul:#3a8fd9;--rojo:#d94a4a}
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:#e6e6e6;max-width:640px;margin:auto;padding:10px}
  h1{color:var(--gold);margin:6px 0}
  h3{margin:12px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:1px}
  input,select,button{padding:10px;border-radius:8px;border:1px solid #333;background:var(--card);color:#fff;font-size:16px;width:100%}
  button{background:var(--gold);color:#000;font-weight:bold;border:0;cursor:pointer}
  button.sec{background:#333;color:#fff}
  .fila{display:flex;gap:6px;margin:4px 0}
  .slots{display:flex;gap:6px;flex-wrap:wrap}
  .slot{width:52px;height:52px;border-radius:8px;background:var(--card);border:2px solid #333;
        display:flex;align-items:center;justify-content:center;font-size:11px;color:#777;cursor:pointer;overflow:hidden;position:relative}
  .slot img{width:100%;height:100%;object-fit:cover}
  .slot.activo{border-color:var(--gold);box-shadow:0 0 6px var(--gold)}
  .ban img{filter:grayscale(1)}
  .ally{border-left:4px solid var(--azul)} .enemy{border-left:4px solid var(--rojo)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;max-height:300px;overflow-y:auto;
        background:#121a21;padding:8px;border-radius:8px;margin-top:6px}
  .champ{text-align:center;font-size:10px;cursor:pointer;line-height:1.1}
  .champ img{width:100%;border-radius:6px;display:block}
  .champ.usado{opacity:.25;pointer-events:none}
  #salida{white-space:pre-wrap;background:var(--card);padding:12px;border-radius:8px;margin-top:10px;min-height:40px}
</style>
</head>
<body>
<h1>LoLator</h1>

<div class="fila">
  <input id="nombre" placeholder="Nombre">
  <input id="tag" placeholder="TAG" style="max-width:110px">
</div>
<div class="fila">
  <select id="rol">
    <option>top</option><option>jungla</option><option>mid</option><option>adc</option><option>support</option>
  </select>
  <input id="parche" placeholder="Parche (ej. 26.21)">
</div>

<h3>Baneos</h3>
<div class="slots" id="s-ban"></div>
<h3>Tu equipo</h3>
<div class="slots" id="s-ally"></div>
<h3>Equipo enemigo</h3>
<div class="slots" id="s-enemy"></div>

<div class="fila" style="margin-top:10px">
  <input id="buscar" placeholder="Buscar campeón...">
  <select id="clase" style="max-width:150px">
    <option value="">Todas las clases</option>
    <option value="Fighter">Luchador</option>
    <option value="Tank">Tanque</option>
    <option value="Mage">Mago</option>
    <option value="Assassin">Asesino</option>
    <option value="Marksman">Tirador</option>
    <option value="Support">Soporte</option>
  </select>
</div>
<div id="grid">Cargando campeones...</div>

<div class="fila" style="margin-top:10px">
  <button onclick="ir('ban')">Qué banear</button>
  <button onclick="ir('pick')">Qué pickear</button>
  <button onclick="ir('build')">Build</button>
</div>
<button class="sec" onclick="reiniciar()">Reiniciar draft</button>
<div id="salida"></div>

<script>
const API = "https://TU-WORKER.TU-USUARIO.workers.dev";
const NUM = { ban: 10, ally: 5, enemy: 5 };
const estado = { ban: Array(10).fill(null), ally: Array(5).fill(null), enemy: Array(5).fill(null) };
let activo = { g: "ally", i: 0 };
let version = "", campeones = [];

["nombre", "tag", "rol", "parche"].forEach(id => {
  const v = localStorage.getItem(id);
  if (v) document.getElementById(id).value = v;
});

function pintarSlots() {
  for (const g of Object.keys(NUM)) {
    const cont = document.getElementById("s-" + g);
    cont.innerHTML = "";
    estado[g].forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "slot " + g + (activo.g === g && activo.i === i ? " activo" : "");
      if (c) {
        const img = document.createElement("img");
        img.src = imgUrl(c);
        img.alt = c.name;
        d.appendChild(img);
      } else {
        d.textContent = g === "ban" ? "Ban" : (i + 1);
      }
      d.onclick = () => {
        if (estado[g][i]) { estado[g][i] = null; }
        activo = { g, i };
        pintarSlots(); pintarGrid();
      };
      cont.appendChild(d);
    });
  }
}

const imgUrl = c => `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${c.id}.png`;

function usados() {
  return new Set([...estado.ban, ...estado.ally, ...estado.enemy].filter(Boolean).map(c => c.id));
}

function pintarGrid() {
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const clase = document.getElementById("clase").value;
  const u = usados();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  campeones
    .filter(c => c.name.toLowerCase().includes(q) && (!clase || c.tags.includes(clase)))
    .forEach(c => {
      const d = document.createElement("div");
      d.className = "champ" + (u.has(c.id) ? " usado" : "");
      d.innerHTML = `<img src="${imgUrl(c)}" alt="${c.name}" loading="lazy"><span>${c.name}</span>`;
      d.onclick = () => elegir(c);
      grid.appendChild(d);
    });
}

function elegir(c) {
  estado[activo.g][activo.i] = c;
  const sig = estado[activo.g].findIndex(x => !x);
  if (sig !== -1) activo.i = sig;
  pintarSlots(); pintarGrid();
}

function reiniciar() {
  estado.ban.fill(null); estado.ally.fill(null); estado.enemy.fill(null);
  activo = { g: "ally", i: 0 };
  document.getElementById("salida").textContent = "";
  pintarSlots(); pintarGrid();
}

async function cargarCampeones() {
  try {
    const vs = await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json();
    version = vs[0];
    const p = document.getElementById("parche");
    if (!p.value) p.value = version.split(".").slice(0, 2).join(".");
    const j = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/es_ES/champion.json`)).json();
    campeones = Object.values(j.data).sort((a, b) => a.name.localeCompare(b.name, "es"));
    pintarSlots(); pintarGrid();
  } catch (e) {
    document.getElementById("grid").textContent = "Error cargando campeones: " + e.message;
  }
}

const nombres = g => estado[g].filter(Boolean).map(c => c.name).join(", ") || "ninguno";

async function ir(modo) {
  const datos = { modo, aliados: nombres("ally"), enemigos: nombres("enemy"), bans: nombres("ban") };
  ["nombre", "tag", "rol", "parche"].forEach(id => {
    datos[id] = document.getElementById(id).value;
    localStorage.setItem(id, datos[id]);
  });
  const out = document.getElementById("salida");
  out.textContent = "Pensando...";
  try {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(datos) });
    const j = await r.json();
    out.textContent = j.error ? "Error: " + j.error : j.respuesta;
  } catch (e) { out.textContent = "Error: " + e.message; }
}

document.getElementById("buscar").addEventListener("input", pintarGrid);
document.getElementById("clase").addEventListener("change", pintarGrid);
pintarSlots();
cargarCampeones();
</script>
</body>
</html>
